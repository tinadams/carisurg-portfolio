seed: 42

data:
  raw_path: "data/yaleemmlc_admissionprediction_triage.csv"
  target: "esi"
  test_size: 0.20

features:
  use_engineered_features: false

preprocessing:
  scale_numeric_features: true

final_model: "logistic_regression"

models:
  logistic_regression:
    max_iter: 1000
    random_state: 42

  tuned_random_forest:
    n_estimators: 200
    max_depth: null
    min_samples_leaf: 8
    max_features: null
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1
