seed: 42

data:
  raw_path: "data/yaleemmlc_admissionprediction_triage.csv"
  target: "esi"
  test_size: 0.20

features:
  use_engineered_features: false
  include_age: true

model:
  name: "logistic_regression"
  max_iter: 1000

outputs:
  directory: "outputs"
  model_file: "logistic_regression.joblib"
  results_file: "model_results.csv"
